<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Tank Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .game-wrapper {
            position: relative;
            border: 4px solid #4a9eff;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.5),
                        inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            display: block;
            background: #000;
        }

        .info-panel {
            background: linear-gradient(180deg, #1e3a5f 0%, #0d1b2a 100%);
            border: 3px solid #4a9eff;
            border-radius: 8px;
            padding: 20px;
            min-width: 200px;
            color: #fff;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }

        .info-panel h2 {
            color: #4a9eff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5em;
            text-shadow: 0 0 10px rgba(74, 158, 255, 0.5);
            border-bottom: 2px solid #4a9eff;
            padding-bottom: 10px;
        }

        .stat-item {
            margin: 15px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            border-left: 3px solid #4a9eff;
        }

        .stat-label {
            color: #8cb4d8;
            font-size: 0.9em;
        }

        .stat-value {
            color: #fff;
            font-size: 1.3em;
            font-weight: bold;
        }

        .lives-display {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .life-icon {
            width: 20px;
            height: 20px;
            background: #4a9eff;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .life-icon.lost {
            background: #333;
        }

        .controls-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-size: 0.85em;
        }

        .controls-info h3 {
            color: #4a9eff;
            margin-bottom: 10px;
        }

        .controls-info p {
            color: #8cb4d8;
            margin: 5px 0;
        }

        .key {
            display: inline-block;
            background: #2a4a6a;
            padding: 2px 8px;
            border-radius: 3px;
            color: #fff;
            font-family: monospace;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 4px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px currentColor;
        }

        .overlay.victory h1 {
            color: #4aff4a;
        }

        .overlay.defeat h1 {
            color: #ff4a4a;
        }

        .overlay.start h1 {
            color: #4a9eff;
            font-size: 2.5em;
        }

        .overlay p {
            color: #fff;
            font-size: 1.2em;
            margin: 10px 0;
        }

        .btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.2em;
            background: linear-gradient(180deg, #4a9eff 0%, #2a6abf 100%);
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
        }

        .powerup-status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.9em;
            text-align: center;
        }

        .powerup-status.attack {
            background: rgba(255, 100, 100, 0.3);
            border: 1px solid #ff6464;
            color: #ff6464;
        }

        .powerup-status.life {
            background: rgba(100, 255, 100, 0.3);
            border: 1px solid #64ff64;
            color: #64ff64;
        }

        .difficulty-select {
            margin: 15px 0;
        }

        .difficulty-select select {
            padding: 8px 15px;
            font-size: 1em;
            background: #2a4a6a;
            color: #fff;
            border: 2px solid #4a9eff;
            border-radius: 5px;
            cursor: pointer;
        }

        .timer-display {
            font-size: 1.5em;
            color: #ffcc00;
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            margin-top: 10px;
        }

        .timer-display.warning {
            color: #ff4444;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="624" height="624"></canvas>
            
            <!-- 开始界面 -->
            <div id="startOverlay" class="overlay start">
                <h1>🎮 坦克大战</h1>
                <p>消灭所有敌人，保护你的基地！</p>
                <div class="difficulty-select">
                    <label style="color: #8cb4d8;">选择难度：</label>
                    <select id="difficultySelect">
                        <option value="easy">简单</option>
                        <option value="normal" selected>普通</option>
                        <option value="hard">困难</option>
                    </select>
                </div>
                <button class="btn" onclick="startGame()">开始游戏</button>
                <p style="margin-top: 20px; font-size: 0.9em; color: #666;">
                    支持本地存档 (localStorage)
                </p>
            </div>

            <!-- 胜利界面 -->
            <div id="victoryOverlay" class="overlay victory hidden">
                <h1>🎉 胜利！</h1>
                <p id="victoryStats"></p>
                <button class="btn" onclick="restartGame()">再来一局</button>
            </div>

            <!-- 失败界面 -->
            <div id="defeatOverlay" class="overlay defeat hidden">
                <h1>💥 失败</h1>
                <p id="defeatReason"></p>
                <button class="btn" onclick="restartGame()">重新开始</button>
            </div>

            <!-- 平局界面 -->
            <div id="drawOverlay" class="overlay hidden" style="background: rgba(0, 0, 0, 0.85);">
                <h1 style="color: #ffcc00;">⏰ 时间到！</h1>
                <p>游戏平局</p>
                <button class="btn" onclick="restartGame()">重新开始</button>
            </div>
        </div>

        <div class="info-panel">
            <h2>战斗信息</h2>
            
            <div class="stat-item">
                <div class="stat-label">剩余敌人</div>
                <div class="stat-value" id="enemyCount">20</div>
            </div>

            <div class="stat-item">
                <div class="stat-label">玩家生命</div>
                <div class="lives-display" id="livesDisplay"></div>
            </div>

            <div class="stat-item">
                <div class="stat-label">得分</div>
                <div class="stat-value" id="score">0</div>
            </div>

            <div class="stat-item">
                <div class="stat-label">击杀数</div>
                <div class="stat-value" id="kills">0</div>
            </div>

            <div id="powerupStatus"></div>

            <div class="timer-display" id="timerDisplay">03:00</div>

            <div class="controls-info">
                <h3>操作说明</h3>
                <p><span class="key">↑↓←→</span> 移动</p>
                <p><span class="key">空格</span> 射击</p>
                <p><span class="key">P</span> 暂停</p>
            </div>
        </div>
    </div>

    <script>
        // ==================== 游戏配置 ====================
        const CONFIG = {
            TILE_SIZE: 24,
            MAP_WIDTH: 26,
            MAP_HEIGHT: 26,
            PLAYER_SPEED: 2,
            PLAYER_BULLET_SPEED: 5,
            PLAYER_FIRE_COOLDOWN: 500,
            ENEMY_COUNT: 20,
            MAX_ENEMIES_ON_SCREEN: 4,
            GAME_TIME: 180,
            
            // 难度配置
            DIFFICULTY: {
                easy: {
                    enemySpeed: 1,
                    enemyBulletSpeed: 3,
                    enemyFireRate: 2000,
                    enemyMaxBullets: 1,
                    playerLives: 5
                },
                normal: {
                    enemySpeed: 1.5,
                    enemyBulletSpeed: 4,
                    enemyFireRate: 1500,
                    enemyMaxBullets: 2,
                    playerLives: 3
                },
                hard: {
                    enemySpeed: 2,
                    enemyBulletSpeed: 5,
                    enemyFireRate: 1000,
                    enemyMaxBullets: 3,
                    playerLives: 2
                }
            }
        };

        // ==================== 地图元素类型 ====================
        const TILE = {
            EMPTY: 0,
            BRICK: 1,
            STEEL: 2,
            GRASS: 3,
            WATER: 4,
            BASE: 5
        };

        // ==================== 游戏状态 ====================
        let canvas, ctx;
        let gameState = 'start';
        let currentDifficulty = 'normal';
        let gameTime = CONFIG.GAME_TIME;
        let timerInterval = null;

        // 玩家状态
        let player = null;
        let enemies = [];
        let bullets = [];
        let powerups = [];
        let explosions = [];

        // 统计
        let score = 0;
        let kills = 0;
        let enemiesRemaining = CONFIG.ENEMY_COUNT;

        // 地图数据
        let map = [];

        // 道具效果
        let attackBoost = { active: false, endTime: 0 };

        // 射击冷却
        let playerLastFire = 0;

        // 暂停状态
        let isPaused = false;

        // ==================== 地图生成 ====================
        function generateMap() {
            map = [];
            for (let y = 0; y < CONFIG.MAP_HEIGHT; y++) {
                map[y] = [];
                for (let x = 0; x < CONFIG.MAP_WIDTH; x++) {
                    map[y][x] = TILE.EMPTY;
                }
            }

            // 添加基地（底部中央）
            const baseX = Math.floor(CONFIG.MAP_WIDTH / 2);
            const baseY = CONFIG.MAP_HEIGHT - 2;
            map[baseY][baseX] = TILE.BASE;
            
            // 基地周围的保护墙
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = baseX + dx;
                    const ny = baseY + dy;
                    if (nx >= 0 && nx < CONFIG.MAP_WIDTH && ny >= 0 && ny < CONFIG.MAP_HEIGHT) {
                        map[ny][nx] = TILE.BRICK;
                    }
                }
            }

            // 生成随机障碍物
            const obstaclePatterns = [
                // 砖墙群
                { type: TILE.BRICK, count: 80 },
                // 铁墙
                { type: TILE.STEEL, count: 15 },
                // 草地
                { type: TILE.GRASS, count: 20 }
            ];

            obstaclePatterns.forEach(pattern => {
                for (let i = 0; i < pattern.count; i++) {
                    let x, y;
                    let attempts = 0;
                    do {
                        x = Math.floor(Math.random() * CONFIG.MAP_WIDTH);
                        y = Math.floor(Math.random() * (CONFIG.MAP_HEIGHT - 4)) + 2;
                        attempts++;
                    } while (isImportantArea(x, y) && attempts < 50);

                    if (attempts < 50) {
                        map[y][x] = pattern.type;
                        // 有概率生成连续障碍
                        if (Math.random() < 0.3) {
                            const dir = Math.floor(Math.random() * 4);
                            const dx = [1, -1, 0, 0][dir];
                            const dy = [0, 0, 1, -1][dir];
                            const nx = x + dx;
                            const ny = y + dy;
                            if (!isImportantArea(nx, ny) && nx >= 0 && nx < CONFIG.MAP_WIDTH && ny >= 0 && ny < CONFIG.MAP_HEIGHT - 4) {
                                map[ny][nx] = pattern.type;
                            }
                        }
                    }
                }
            });
        }

        function isImportantArea(x, y) {
            // 玩家出生点（左下）
            if (x >= 0 && x <= 3 && y >= CONFIG.MAP_HEIGHT - 4) return true;
            // 敌人出生点（顶部三个位置）
            if (y <= 2 && (x <= 2 || (x >= 11 && x <= 14) || x >= CONFIG.MAP_WIDTH - 3)) return true;
            // 基地区域
            const baseX = Math.floor(CONFIG.MAP_WIDTH / 2);
            const baseY = CONFIG.MAP_HEIGHT - 2;
            if (Math.abs(x - baseX) <= 2 && Math.abs(y - baseY) <= 2) return true;
            return false;
        }

        // ==================== 坦克类 ====================
        class Tank {
            constructor(x, y, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.width = CONFIG.TILE_SIZE * 2;
                this.height = CONFIG.TILE_SIZE * 2;
                this.direction = isPlayer ? 'up' : 'down';
                this.isPlayer = isPlayer;
                this.lastFire = 0;
                this.bullets = [];
                
                const diff = CONFIG.DIFFICULTY[currentDifficulty];
                
                if (isPlayer) {
                    this.speed = CONFIG.PLAYER_SPEED;
                    this.lives = diff.playerLives;
                    this.maxBullets = 2;
                    this.bulletSpeed = CONFIG.PLAYER_BULLET_SPEED;
                    this.fireCooldown = CONFIG.PLAYER_FIRE_COOLDOWN;
                    this.color = '#4a9eff';
                } else {
                    this.speed = diff.enemySpeed;
                    this.lives = 1;
                    this.maxBullets = diff.enemyMaxBullets;
                    this.bulletSpeed = diff.enemyBulletSpeed;
                    this.fireCooldown = diff.enemyFireRate;
                    this.color = '#ff6b6b';
                    this.moveTimer = 0;
                    this.moveDirection = 'down';
                }
            }

            move(dx, dy) {
                const newX = this.x + dx * this.speed;
                const newY = this.y + dy * this.speed;

                if (this.canMoveTo(newX, newY)) {
                    this.x = newX;
                    this.y = newY;
                    return true;
                }
                return false;
            }

            canMoveTo(newX, newY) {
                // 边界检测
                if (newX < 0 || newX + this.width > canvas.width ||
                    newY < 0 || newY + this.height > canvas.height) {
                    return false;
                }

                // 地图碰撞检测
                const tileSize = CONFIG.TILE_SIZE;
                const startTileX = Math.floor(newX / tileSize);
                const startTileY = Math.floor(newY / tileSize);
                const endTileX = Math.floor((newX + this.width - 1) / tileSize);
                const endTileY = Math.floor((newY + this.height - 1) / tileSize);

                for (let ty = startTileY; ty <= endTileY; ty++) {
                    for (let tx = startTileX; tx <= endTileX; tx++) {
                        if (ty >= 0 && ty < CONFIG.MAP_HEIGHT && tx >= 0 && tx < CONFIG.MAP_WIDTH) {
                            const tile = map[ty][tx];
                            if (tile === TILE.BRICK || tile === TILE.STEEL || tile === TILE.WATER || tile === TILE.BASE) {
                                return false;
                            }
                        }
                    }
                }

                // 与其他坦克碰撞检测
                const tanks = this.isPlayer ? enemies : [player, ...enemies.filter(e => e !== this)];
                for (const tank of tanks) {
                    if (tank && this.wouldCollide(newX, newY, tank)) {
                        return false;
                    }
                }

                return true;
            }

            wouldCollide(newX, newY, other) {
                return newX < other.x + other.width &&
                       newX + this.width > other.x &&
                       newY < other.y + other.height &&
                       newY + this.height > other.y;
            }

            fire() {
                const now = Date.now();
                const cooldown = attackBoost.active ? this.fireCooldown * 0.5 : this.fireCooldown;
                
                if (now - this.lastFire < cooldown) return false;
                if (this.bullets.length >= this.maxBullets) return false;

                this.lastFire = now;
                
                const bullet = new Bullet(
                    this.x + this.width / 2,
                    this.y + this.height / 2,
                    this.direction,
                    this.isPlayer,
                    this.bulletSpeed
                );
                this.bullets.push(bullet);
                bullets.push(bullet);
                return true;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                // 根据方向旋转
                const angles = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 };
                ctx.rotate(angles[this.direction]);

                // 坦克主体
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2 + 4, -this.height / 2 + 4, this.width - 8, this.height - 8);

                // 履带
                ctx.fillStyle = this.isPlayer ? '#2a5a8f' : '#8b3a3a';
                ctx.fillRect(-this.width / 2, -this.height / 2 + 2, 6, this.height - 4);
                ctx.fillRect(this.width / 2 - 6, -this.height / 2 + 2, 6, this.height - 4);

                // 炮塔
                ctx.fillStyle = this.isPlayer ? '#6ab0ff' : '#ff8888';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();

                // 炮管
                ctx.fillStyle = this.isPlayer ? '#3a7abf' : '#bf4a4a';
                ctx.fillRect(-3, -this.height / 2 - 5, 6, this.height / 2 + 5);

                // 攻击增强效果
                if (this.isPlayer && attackBoost.active) {
                    ctx.strokeStyle = '#ff6464';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-this.width / 2 - 2, -this.height / 2 - 2, this.width + 4, this.height + 4);
                }

                ctx.restore();
            }

            update() {
                if (!this.isPlayer) {
                    this.updateAI();
                }
                
                // 更新子弹
                this.bullets = this.bullets.filter(b => b.active);
            }

            updateAI() {
                this.moveTimer++;
                
                // 随机改变方向
                if (this.moveTimer > 60 || Math.random() < 0.01) {
                    this.moveTimer = 0;
                    const directions = ['up', 'down', 'left', 'right'];
                    
                    // 有概率朝向玩家
                    if (player && Math.random() < 0.3) {
                        const dx = player.x - this.x;
                        const dy = player.y - this.y;
                        if (Math.abs(dx) > Math.abs(dy)) {
                            this.moveDirection = dx > 0 ? 'right' : 'left';
                        } else {
                            this.moveDirection = dy > 0 ? 'down' : 'up';
                        }
                    } else {
                        this.moveDirection = directions[Math.floor(Math.random() * directions.length)];
                    }
                }

                this.direction = this.moveDirection;
                const moves = {
                    up: [0, -1],
                    down: [0, 1],
                    left: [-1, 0],
                    right: [1, 0]
                };
                const [dx, dy] = moves[this.moveDirection];
                this.move(dx, dy);

                // 随机射击
                if (Math.random() < 0.03) {
                    this.fire();
                }
            }

            hit() {
                this.lives--;
                return this.lives <= 0;
            }
        }

        // ==================== 子弹类 ====================
        class Bullet {
            constructor(x, y, direction, isPlayerBullet, speed) {
                this.x = x;
                this.y = y;
                this.direction = direction;
                this.isPlayerBullet = isPlayerBullet;
                this.speed = speed;
                this.size = 6;
                this.active = true;
            }

            update() {
                const moves = {
                    up: [0, -1],
                    down: [0, 1],
                    left: [-1, 0],
                    right: [1, 0]
                };
                const [dx, dy] = moves[this.direction];
                this.x += dx * this.speed;
                this.y += dy * this.speed;

                // 边界检测
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.active = false;
                    return;
                }

                // 地图碰撞
                this.checkMapCollision();

                // 坦克碰撞
                this.checkTankCollision();
            }

            checkMapCollision() {
                const tileX = Math.floor(this.x / CONFIG.TILE_SIZE);
                const tileY = Math.floor(this.y / CONFIG.TILE_SIZE);

                if (tileY >= 0 && tileY < CONFIG.MAP_HEIGHT && tileX >= 0 && tileX < CONFIG.MAP_WIDTH) {
                    const tile = map[tileY][tileX];
                    
                    if (tile === TILE.BRICK) {
                        map[tileY][tileX] = TILE.EMPTY;
                        this.active = false;
                        createExplosion(tileX * CONFIG.TILE_SIZE, tileY * CONFIG.TILE_SIZE, 'small');
                    } else if (tile === TILE.STEEL) {
                        // 铁墙阻挡子弹，不穿透
                        this.active = false;
                        createExplosion(this.x - 10, this.y - 10, 'tiny');
                    } else if (tile === TILE.BASE) {
                        // 摧毁基地
                        map[tileY][tileX] = TILE.EMPTY;
                        this.active = false;
                        createExplosion(tileX * CONFIG.TILE_SIZE - 12, tileY * CONFIG.TILE_SIZE - 12, 'large');
                        gameOver('基地被摧毁！');
                    }
                }
            }

            checkTankCollision() {
                if (this.isPlayerBullet) {
                    // 玩家子弹击中敌人
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        const enemy = enemies[i];
                        if (this.hitsTank(enemy)) {
                            this.active = false;
                            createExplosion(enemy.x, enemy.y, 'medium');
                            
                            // 随机掉落道具
                            if (Math.random() < 0.15) {
                                spawnPowerup(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                            }
                            
                            enemies.splice(i, 1);
                            score += 100;
                            kills++;
                            enemiesRemaining--;
                            updateUI();
                            
                            if (enemiesRemaining <= 0 && enemies.length === 0) {
                                victory();
                            }
                            break;
                        }
                    }
                } else {
                    // 敌人子弹击中玩家
                    if (player && this.hitsTank(player)) {
                        this.active = false;
                        createExplosion(player.x, player.y, 'medium');
                        
                        if (player.hit()) {
                            player.lives = CONFIG.DIFFICULTY[currentDifficulty].playerLives;
                            // 重生
                            player.x = CONFIG.TILE_SIZE * 2;
                            player.y = (CONFIG.MAP_HEIGHT - 3) * CONFIG.TILE_SIZE;
                            player.direction = 'up';
                        }
                        updateUI();
                        
                        if (player.lives <= 0) {
                            gameOver('生命耗尽！');
                        }
                    }
                }
            }

            hitsTank(tank) {
                return this.x > tank.x && this.x < tank.x + tank.width &&
                       this.y > tank.y && this.y < tank.y + tank.height;
            }

            draw() {
                ctx.fillStyle = this.isPlayerBullet ? '#ffff00' : '#ff4444';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 发光效果
                ctx.shadowColor = this.isPlayerBullet ? '#ffff00' : '#ff4444';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // ==================== 道具类 ====================
        class Powerup {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'attack' or 'life'
                this.size = 20;
                this.active = true;
                this.spawnTime = Date.now();
                this.duration = 10000; // 10秒后消失
            }

            update() {
                // 检查是否过期
                if (Date.now() - this.spawnTime > this.duration) {
                    this.active = false;
                    return;
                }

                // 检查玩家拾取
                if (player) {
                    const dx = this.x - (player.x + player.width / 2);
                    const dy = this.y - (player.y + player.height / 2);
                    if (Math.sqrt(dx * dx + dy * dy) < 30) {
                        this.apply();
                        this.active = false;
                    }
                }
            }

            apply() {
                if (this.type === 'attack') {
                    // 攻击提升：持续10秒
                    attackBoost.active = true;
                    attackBoost.endTime = Date.now() + 10000;
                    showPowerupStatus('attack', 10000);
                } else if (this.type === 'life') {
                    // 生命增加
                    player.lives++;
                    updateUI();
                    showPowerupStatus('life', 0);
                }
            }

            draw() {
                const pulse = Math.sin(Date.now() / 100) * 3;
                
                ctx.save();
                ctx.translate(this.x, this.y);

                // 外圈发光
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 2 + pulse + 5, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'attack' ? 'rgba(255, 100, 100, 0.3)' : 'rgba(100, 255, 100, 0.3)';
                ctx.fill();

                // 主体
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 2 + pulse, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'attack' ? '#ff6464' : '#64ff64';
                ctx.fill();

                // 图标
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type === 'attack' ? '⚔' : '❤', 0, 0);

                ctx.restore();
            }
        }

        // ==================== 爆炸效果 ====================
        function createExplosion(x, y, size) {
            explosions.push({
                x, y,
                size: size === 'large' ? 48 : size === 'medium' ? 32 : size === 'small' ? 24 : 16,
                frame: 0,
                maxFrames: 15
            });
        }

        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                explosions[i].frame++;
                if (explosions[i].frame >= explosions[i].maxFrames) {
                    explosions.splice(i, 1);
                }
            }
        }

        function drawExplosions() {
            explosions.forEach(exp => {
                const progress = exp.frame / exp.maxFrames;
                const radius = exp.size * (1 - progress * 0.5);
                const alpha = 1 - progress;

                ctx.save();
                ctx.globalAlpha = alpha;

                // 外圈
                ctx.beginPath();
                ctx.arc(exp.x + exp.size / 2, exp.y + exp.size / 2, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, ${100 + progress * 155}, 0, ${alpha})`;
                ctx.fill();

                // 内圈
                ctx.beginPath();
                ctx.arc(exp.x + exp.size / 2, exp.y + exp.size / 2, radius * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 0, ${alpha})`;
                ctx.fill();

                ctx.restore();
            });
        }

        // ==================== 地图绘制 ====================
        function drawMap() {
            const tileSize = CONFIG.TILE_SIZE;

            for (let y = 0; y < CONFIG.MAP_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.MAP_WIDTH; x++) {
                    const tile = map[y][x];
                    const px = x * tileSize;
                    const py = y * tileSize;

                    switch (tile) {
                        case TILE.BRICK:
                            drawBrick(px, py, tileSize);
                            break;
                        case TILE.STEEL:
                            drawSteel(px, py, tileSize);
                            break;
                        case TILE.GRASS:
                            // 草地在坦克上层绘制
                            break;
                        case TILE.BASE:
                            drawBase(px, py, tileSize);
                            break;
                    }
                }
            }
        }

        function drawGrass() {
            const tileSize = CONFIG.TILE_SIZE;
            for (let y = 0; y < CONFIG.MAP_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.MAP_WIDTH; x++) {
                    if (map[y][x] === TILE.GRASS) {
                        const px = x * tileSize;
                        const py = y * tileSize;
                        
                        ctx.fillStyle = '#228b22';
                        ctx.fillRect(px, py, tileSize, tileSize);
                        
                        // 草纹理
                        ctx.fillStyle = '#32cd32';
                        for (let i = 0; i < 3; i++) {
                            for (let j = 0; j < 3; j++) {
                                ctx.fillRect(px + i * 8 + 2, py + j * 8 + 2, 4, 4);
                            }
                        }
                    }
                }
            }
        }

        function drawBrick(x, y, size) {
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(x, y, size, size);
            
            // 砖纹理
            ctx.fillStyle = '#a0522d';
            ctx.fillRect(x, y, size / 2 - 1, size / 2 - 1);
            ctx.fillRect(x + size / 2, y + size / 2, size / 2 - 1, size / 2 - 1);
            
            ctx.fillStyle = '#6b3510';
            ctx.fillRect(x + size / 2, y, size / 2 - 1, size / 2 - 1);
            ctx.fillRect(x, y + size / 2, size / 2 - 1, size / 2 - 1);
        }

        function drawSteel(x, y, size) {
            ctx.fillStyle = '#708090';
            ctx.fillRect(x, y, size, size);
            
            // 金属光泽
            ctx.fillStyle = '#a0a0a0';
            ctx.fillRect(x + 2, y + 2, size - 4, 3);
            ctx.fillRect(x + 2, y + 2, 3, size - 4);
            
            ctx.fillStyle = '#505050';
            ctx.fillRect(x + size - 4, y + 2, 2, size - 4);
            ctx.fillRect(x + 2, y + size - 4, size - 4, 2);
        }

        function drawBase(x, y, size) {
            // 基地背景
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(x, y, size, size);
            
            // 鹰标志
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(x + size / 2, y + 4);
            ctx.lineTo(x + size - 4, y + size / 2);
            ctx.lineTo(x + size / 2, y + size - 4);
            ctx.lineTo(x + 4, y + size / 2);
            ctx.closePath();
            ctx.fill();
            
            // 内部
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.moveTo(x + size / 2, y + 8);
            ctx.lineTo(x + size - 8, y + size / 2);
            ctx.lineTo(x + size / 2, y + size - 8);
            ctx.lineTo(x + 8, y + size / 2);
            ctx.closePath();
            ctx.fill();
        }

        // ==================== 敌人生成 ====================
        function spawnEnemy() {
            if (enemies.length >= CONFIG.MAX_ENEMIES_ON_SCREEN || enemiesRemaining <= enemies.length) return;

            const spawnPoints = [
                { x: CONFIG.TILE_SIZE, y: CONFIG.TILE_SIZE },
                { x: CONFIG.MAP_WIDTH / 2 * CONFIG.TILE_SIZE, y: CONFIG.TILE_SIZE },
                { x: (CONFIG.MAP_WIDTH - 3) * CONFIG.TILE_SIZE, y: CONFIG.TILE_SIZE }
            ];

            const spawn = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
            
            // 检查生成点是否被占用
            const occupied = enemies.some(e => 
                Math.abs(e.x - spawn.x) < 50 && Math.abs(e.y - spawn.y) < 50
            ) || (player && Math.abs(player.x - spawn.x) < 50 && Math.abs(player.y - spawn.y) < 50);

            if (!occupied) {
                const enemy = new Tank(spawn.x, spawn.y, false);
                enemies.push(enemy);
            }
        }

        // ==================== 道具生成 ====================
        function spawnPowerup(x, y) {
            const type = Math.random() < 0.5 ? 'attack' : 'life';
            powerups.push(new Powerup(x, y, type));
        }

        // ==================== UI更新 ====================
        function updateUI() {
            document.getElementById('enemyCount').textContent = enemiesRemaining;
            document.getElementById('score').textContent = score;
            document.getElementById('kills').textContent = kills;

            // 生命显示
            const livesDisplay = document.getElementById('livesDisplay');
            const maxLives = CONFIG.DIFFICULTY[currentDifficulty].playerLives;
            livesDisplay.innerHTML = '';
            for (let i = 0; i < maxLives; i++) {
                const lifeIcon = document.createElement('div');
                lifeIcon.className = 'life-icon' + (i >= player.lives ? ' lost' : '');
                livesDisplay.appendChild(lifeIcon);
            }
        }

        function showPowerupStatus(type, duration) {
            const statusDiv = document.getElementById('powerupStatus');
            if (type === 'attack') {
                statusDiv.innerHTML = `<div class="powerup-status attack">⚔ 攻击提升中！ (${duration / 1000}秒)</div>`;
                setTimeout(() => {
                    if (!attackBoost.active) {
                        statusDiv.innerHTML = '';
                    }
                }, duration);
            } else {
                statusDiv.innerHTML = `<div class="powerup-status life">❤ 生命 +1！</div>`;
                setTimeout(() => {
                    statusDiv.innerHTML = '';
                }, 2000);
            }
        }

        function updateTimer() {
            const minutes = Math.floor(gameTime / 60);
            const seconds = gameTime % 60;
            const timerDisplay = document.getElementById('timerDisplay');
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (gameTime <= 30) {
                timerDisplay.classList.add('warning');
            }
        }

        // ==================== 游戏控制 ====================
        function startGame() {
            currentDifficulty = document.getElementById('difficultySelect').value;
            
            // 检查是否有存档
            const savedGame = localStorage.getItem('tankBattleSave');
            if (savedGame) {
                const save = JSON.parse(savedGame);
                if (confirm('发现存档，是否继续上一局？\n取消则开始新游戏。')) {
                    loadGame(save);
                    return;
                }
            }

            initGame();
        }

        function initGame() {
            // 隐藏所有覆盖层
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('victoryOverlay').classList.add('hidden');
            document.getElementById('defeatOverlay').classList.add('hidden');
            document.getElementById('drawOverlay').classList.add('hidden');

            // 重置状态
            gameState = 'playing';
            score = 0;
            kills = 0;
            gameTime = CONFIG.GAME_TIME;
            enemiesRemaining = CONFIG.ENEMY_COUNT;
            enemies = [];
            bullets = [];
            powerups = [];
            explosions = [];
            attackBoost = { active: false, endTime: 0 };
            isPaused = false;

            // 生成地图
            generateMap();

            // 创建玩家
            player = new Tank(CONFIG.TILE_SIZE * 2, (CONFIG.MAP_HEIGHT - 3) * CONFIG.TILE_SIZE, true);

            // 更新UI
            updateUI();
            updateTimer();
            document.getElementById('timerDisplay').classList.remove('warning');

            // 启动计时器
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused && gameState === 'playing') {
                    gameTime--;
                    updateTimer();
                    
                    // 自动保存
                    saveGame();
                    
                    if (gameTime <= 0) {
                        draw();
                    }
                }
            }, 1000);

            // 启动敌人生成器
            spawnEnemyLoop();
        }

        function spawnEnemyLoop() {
            if (gameState !== 'playing') return;
            
            spawnEnemy();
            setTimeout(spawnEnemyLoop, 3000);
        }

        function victory() {
            gameState = 'victory';
            clearInterval(timerInterval);
            localStorage.removeItem('tankBattleSave');
            
            document.getElementById('victoryStats').textContent = 
                `得分: ${score} | 击杀: ${kills} | 剩余时间: ${Math.floor(gameTime / 60)}:${(gameTime % 60).toString().padStart(2, '0')}`;
            document.getElementById('victoryOverlay').classList.remove('hidden');
        }

        function gameOver(reason) {
            gameState = 'gameover';
            clearInterval(timerInterval);
            localStorage.removeItem('tankBattleSave');
            
            document.getElementById('defeatReason').textContent = reason + ` | 得分: ${score} | 击杀: ${kills}`;
            document.getElementById('defeatOverlay').classList.remove('hidden');
        }

        function restartGame() {
            localStorage.removeItem('tankBattleSave');
            initGame();
        }

        // ==================== 存档系统 ====================
        function saveGame() {
            const saveData = {
                difficulty: currentDifficulty,
                score,
                kills,
                gameTime,
                enemiesRemaining,
                playerLives: player ? player.lives : 3,
                playerX: player ? player.x : 0,
                playerY: player ? player.y : 0,
                playerDirection: player ? player.direction : 'up',
                map,
                timestamp: Date.now()
            };
            localStorage.setItem('tankBattleSave', JSON.stringify(saveData));
        }

        function loadGame(save) {
            currentDifficulty = save.difficulty;
            score = save.score;
            kills = save.kills;
            gameTime = save.gameTime;
            enemiesRemaining = save.enemiesRemaining;
            map = save.map;

            // 隐藏覆盖层
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('victoryOverlay').classList.add('hidden');
            document.getElementById('defeatOverlay').classList.add('hidden');
            document.getElementById('drawOverlay').classList.add('hidden');

            // 创建玩家
            player = new Tank(save.playerX, save.playerY, true);
            player.lives = save.playerLives;
            player.direction = save.playerDirection;

            gameState = 'playing';
            enemies = [];
            bullets = [];
            powerups = [];
            explosions = [];

            updateUI();
            updateTimer();

            // 启动计时器
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused && gameState === 'playing') {
                    gameTime--;
                    updateTimer();
                    saveGame();
                    
                    if (gameTime <= 0) {
                        draw();
                    }
                }
            }, 1000);

            spawnEnemyLoop();
        }

        // ==================== 输入处理 ====================
        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code === 'Space' && gameState === 'playing' && !isPaused) {
                e.preventDefault();
                if (player) player.fire();
            }

            if (e.code === 'KeyP' && gameState === 'playing') {
                isPaused = !isPaused;
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function handleInput() {
            if (!player || isPaused || gameState !== 'playing') return;

            let moved = false;
            
            if (keys['ArrowUp'] || keys['KeyW']) {
                player.direction = 'up';
                moved = player.move(0, -1);
            } else if (keys['ArrowDown'] || keys['KeyS']) {
                player.direction = 'down';
                moved = player.move(0, 1);
            } else if (keys['ArrowLeft'] || keys['KeyA']) {
                player.direction = 'left';
                moved = player.move(-1, 0);
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.direction = 'right';
                moved = player.move(1, 0);
            }
        }

        // ==================== 游戏循环 ====================
        function update() {
            if (gameState !== 'playing' || isPaused) return;

            handleInput();

            // 更新攻击增强状态
            if (attackBoost.active && Date.now() > attackBoost.endTime) {
                attackBoost.active = false;
                document.getElementById('powerupStatus').innerHTML = '';
            }

            // 更新玩家
            if (player) player.update();

            // 更新敌人
            enemies.forEach(enemy => enemy.update());

            // 更新子弹
            bullets = bullets.filter(b => b.active);
            bullets.forEach(bullet => bullet.update());

            // 更新道具
            powerups = powerups.filter(p => p.active);
            powerups.forEach(powerup => powerup.update());

            // 更新爆炸
            updateExplosions();

            // 检查时间
            if (gameTime <= 0) {
                gameState = 'draw';
                clearInterval(timerInterval);
                localStorage.removeItem('tankBattleSave');
                document.getElementById('drawOverlay').classList.remove('hidden');
            }
        }

        function draw() {
            // 清空画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制地图底层
            drawMap();

            // 绘制坦克
            if (player) player.draw();
            enemies.forEach(enemy => enemy.draw());

            // 绘制子弹
            bullets.forEach(bullet => bullet.draw());

            // 绘制道具
            powerups.forEach(powerup => powerup.draw());

            // 绘制草地（覆盖在坦克上方）
            drawGrass();

            // 绘制爆炸
            drawExplosions();

            // 暂停提示
            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏暂停', canvas.width / 2, canvas.height / 2);
                ctx.font = '18px Arial';
                ctx.fillText('按 P 继续', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ==================== 初始化 ====================
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            // 设置画布大小
            canvas.width = CONFIG.MAP_WIDTH * CONFIG.TILE_SIZE;
            canvas.height = CONFIG.MAP_HEIGHT * CONFIG.TILE_SIZE;

            // 启动游戏循环
            gameLoop();
        };
    </script>
</body>
</html>
