<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简化版坦克大战 (Battle City Lite)</title>
    <style>
        body {
            background-color: #202020;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 4px solid #555;
            background-color: #000;
        }
        canvas {
            display: block;
            background-color: #000;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 48px;
            color: #eebb00;
            text-shadow: 4px 4px #a00;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin: 5px 0;
        }
        button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 20px;
            font-family: inherit;
            background: #eebb00;
            border: none;
            cursor: pointer;
            pointer-events: auto;
            color: #000;
            font-weight: bold;
        }
        button:hover {
            background: #ffcc00;
        }
        #hud {
            width: 520px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #333;
            box-sizing: border-box;
            border: 4px solid #555;
            border-bottom: none;
        }
        .hud-item {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-item">生命: <span id="lives-display">3</span></div>
        <div class="hud-item">敌人: <span id="enemies-display">20</span></div>
        <div class="hud-item">分数: <span id="score-display">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="520" height="520"></canvas>
        
        <!-- Start Screen -->
        <div id="start-screen" class="ui-screen">
            <h1>坦克大战</h1>
            <p>方向键移动，空格键射击</p>
            <p>保护基地，消灭所有敌人</p>
            <button onclick="game.start()">开始游戏</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="ui-screen hidden">
            <h1 style="color: #f00;">游戏结束</h1>
            <p id="fail-reason">基地被摧毁！</p>
            <p>最终得分: <span id="final-score-lose">0</span></p>
            <button onclick="game.reset()">重新开始</button>
        </div>

        <!-- Victory Screen -->
        <div id="victory-screen" class="ui-screen hidden">
            <h1 style="color: #0f0;">胜利！</h1>
            <p>所有敌人已被消灭</p>
            <p>最终得分: <span id="final-score-win">0</span></p>
            <button onclick="game.reset()">再玩一次</button>
        </div>
    </div>

    <script>
        // --- 常量配置 ---
        const TILE_SIZE = 20; // 地图块大小
        const MAP_SIZE = 26;  // 26x26 grid
        const CANVAS_SIZE = TILE_SIZE * MAP_SIZE; // 520px
        const FPS = 60;
        
        // 实体类型
        const TYPE = {
            PLAYER: 1,
            ENEMY: 2,
            BULLET: 3,
            BASE: 9
        };

        // 地图元素
        const MAP = {
            EMPTY: 0,
            BRICK: 1, // 砖墙 (可毁)
            IRON: 2,  // 铁墙 (不可毁)
            GRASS: 3, // 草地 (遮挡)
            WATER: 4, // 水 (不可过，子弹可过 - 简化版暂不实现水)
            BASE: 9   // 基地
        };

        // 方向
        const DIR = {
            UP: 0,
            RIGHT: 1,
            DOWN: 2,
            LEFT: 3
        };

        // 道具
        const ITEM = {
            NONE: 0,
            ATTACK_UP: 1, // 射速/子弹速度提升
            LIFE_UP: 2    // 生命+1
        };

        // --- 工具函数 ---
        function rectIntersect(r1, r2) {
            return !(r2.x >= r1.x + r1.w || 
                     r2.x + r2.w <= r1.x || 
                     r2.y >= r1.y + r1.h || 
                     r2.y + r2.h <= r1.y);
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // --- 类定义 ---

        // 基础实体类
        class Entity {
            constructor(x, y, w, h, speed, direction) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.speed = speed;
                this.dir = direction;
                this.markedForDeletion = false;
            }

            getRect() {
                return { x: this.x, y: this.y, w: this.w, h: this.h };
            }

            draw(ctx) {
                // 子类实现
            }
        }

        // 坦克基类
        class Tank extends Entity {
            constructor(x, y, color, speed) {
                super(x, y, TILE_SIZE - 2, TILE_SIZE - 2, speed, DIR.UP);
                this.color = color;
                this.isMoving = false;
                this.cooldown = 0;
                this.maxCooldown = 30; // 射击冷却 (帧)
                this.bulletSpeed = 4;
                this.lives = 1;
            }

            move(map) {
                if (!this.isMoving) return;

                let nextX = this.x;
                let nextY = this.y;

                if (this.dir === DIR.UP) nextY -= this.speed;
                if (this.dir === DIR.DOWN) nextY += this.speed;
                if (this.dir === DIR.LEFT) nextX -= this.speed;
                if (this.dir === DIR.RIGHT) nextX += this.speed;

                // 边界检查
                if (nextX < 0) nextX = 0;
                if (nextY < 0) nextY = 0;
                if (nextX + this.w > CANVAS_SIZE) nextX = CANVAS_SIZE - this.w;
                if (nextY + this.h > CANVAS_SIZE) nextY = CANVAS_SIZE - this.h;

                // 碰撞检查 (墙体 & 基地)
                const rect = { x: nextX, y: nextY, w: this.w, h: this.h };
                if (!game.map.checkCollision(rect)) {
                    // 还要检查与其他坦克的碰撞
                    let hitTank = false;
                    // 检查玩家
                    if (this !== game.player && rectIntersect(rect, game.player.getRect())) hitTank = true;
                    // 检查敌人
                    for (let enemy of game.enemies) {
                        if (this !== enemy && rectIntersect(rect, enemy.getRect())) hitTank = true;
                    }

                    if (!hitTank) {
                        this.x = nextX;
                        this.y = nextY;
                        return true;
                    }
                }
                return false;
            }

            shoot() {
                if (this.cooldown > 0) return;
                
                // 子弹发射位置修正
                let bx = this.x + this.w / 2 - 2;
                let by = this.y + this.h / 2 - 2;
                
                if (this.dir === DIR.UP) by = this.y - 4;
                if (this.dir === DIR.DOWN) by = this.y + this.h;
                if (this.dir === DIR.LEFT) bx = this.x - 4;
                if (this.dir === DIR.RIGHT) bx = this.x + this.w;

                game.bullets.push(new Bullet(bx, by, this.dir, this.bulletSpeed, this));
                this.cooldown = this.maxCooldown;
            }

            update() {
                if (this.cooldown > 0) this.cooldown--;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.w/2, this.y + this.h/2);
                // 旋转
                if (this.dir === DIR.RIGHT) ctx.rotate(Math.PI / 2);
                if (this.dir === DIR.DOWN) ctx.rotate(Math.PI);
                if (this.dir === DIR.LEFT) ctx.rotate(-Math.PI / 2);
                
                // 绘制坦克车身
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
                
                // 绘制炮管
                ctx.fillStyle = '#666';
                ctx.fillRect(-2, -this.h/2 - 4, 4, 10);
                
                // 绘制履带细节
                ctx.fillStyle = '#000';
                ctx.fillRect(-this.w/2, -this.h/2, 4, this.h);
                ctx.fillRect(this.w/2 - 4, -this.h/2, 4, this.h);

                ctx.restore();
            }
        }

        // 玩家类
        class Player extends Tank {
            constructor() {
                super(9 * TILE_SIZE, 24 * TILE_SIZE, '#eebb00', 2);
                this.lives = 3;
                this.score = 0;
                this.power = 0; // 0: Normal, 1: Fast
            }

            update(input) {
                super.update();
                this.isMoving = false;

                if (input.keys['ArrowUp'] || input.keys['w']) {
                    this.dir = DIR.UP;
                    this.isMoving = true;
                } else if (input.keys['ArrowDown'] || input.keys['s']) {
                    this.dir = DIR.DOWN;
                    this.isMoving = true;
                } else if (input.keys['ArrowLeft'] || input.keys['a']) {
                    this.dir = DIR.LEFT;
                    this.isMoving = true;
                } else if (input.keys['ArrowRight'] || input.keys['d']) {
                    this.dir = DIR.RIGHT;
                    this.isMoving = true;
                }

                if (this.isMoving) {
                    this.move();
                }

                if (input.keys[' ']) {
                    this.shoot();
                }
            }
            
            applyPowerUp(type) {
                if (type === ITEM.ATTACK_UP) {
                    this.maxCooldown = Math.max(10, this.maxCooldown - 5);
                    this.bulletSpeed = Math.min(8, this.bulletSpeed + 1);
                    this.power++;
                } else if (type === ITEM.LIFE_UP) {
                    this.lives++;
                    game.ui.updateHud();
                }
            }
        }

        // 敌人类
        class Enemy extends Tank {
            constructor(x, y, hasItem) {
                super(x, y, hasItem ? '#ff0000' : '#cccccc', 1.5); // 红色坦克带道具
                this.hasItem = hasItem;
                this.changeDirTimer = 0;
                this.shootTimer = 0;
                this.dir = DIR.DOWN;
            }

            update() {
                super.update();
                
                // AI 行为：随机改变方向
                if (this.changeDirTimer <= 0) {
                    this.dir = randomInt(0, 3);
                    this.changeDirTimer = randomInt(30, 100);
                } else {
                    this.changeDirTimer--;
                }

                // AI 移动
                this.isMoving = true;
                if (!this.move()) {
                    // 如果被挡住，尝试换方向
                    this.dir = randomInt(0, 3);
                    this.changeDirTimer = randomInt(30, 100);
                }

                // AI 射击
                if (this.shootTimer <= 0) {
                    this.shoot();
                    this.shootTimer = randomInt(50, 200);
                } else {
                    this.shootTimer--;
                }
            }
        }

        // 子弹类
        class Bullet extends Entity {
            constructor(x, y, dir, speed, owner) {
                super(x, y, 4, 4, speed, dir);
                this.owner = owner; // 发射者 (Player 或 Enemy)
            }

            update() {
                if (this.dir === DIR.UP) this.y -= this.speed;
                if (this.dir === DIR.DOWN) this.y += this.speed;
                if (this.dir === DIR.LEFT) this.x -= this.speed;
                if (this.dir === DIR.RIGHT) this.x += this.speed;

                // 边界移除
                if (this.x < 0 || this.x > CANVAS_SIZE || this.y < 0 || this.y > CANVAS_SIZE) {
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x + 2, this.y + 2, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 道具类
        class Item extends Entity {
            constructor(x, y, type) {
                super(x, y, TILE_SIZE, TILE_SIZE, 0, 0);
                this.type = type;
                this.blinkTimer = 0;
                this.visible = true;
            }
            
            update() {
                this.blinkTimer++;
                if (this.blinkTimer % 20 === 0) {
                    this.visible = !this.visible;
                }
            }
            
            draw(ctx) {
                if (!this.visible) return;
                
                ctx.fillStyle = this.type === ITEM.ATTACK_UP ? '#ff0' : '#0f0';
                ctx.fillRect(this.x + 2, this.y + 2, this.w - 4, this.h - 4);
                
                // 绘制图标
                ctx.fillStyle = '#000';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const text = this.type === ITEM.ATTACK_UP ? 'P' : 'L';
                ctx.fillText(text, this.x + this.w/2, this.y + this.h/2);
            }
        }

        // 地图系统
        class GameMap {
            constructor() {
                this.grid = [];
                this.base = { x: 12 * TILE_SIZE, y: 24 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE * 2, active: true };
            }

            generate() {
                // 初始化空地图
                this.grid = new Array(MAP_SIZE).fill(0).map(() => new Array(MAP_SIZE).fill(MAP.EMPTY));

                // 简单的地图生成逻辑
                for (let r = 0; r < MAP_SIZE; r++) {
                    for (let c = 0; c < MAP_SIZE; c++) {
                        // 边界留空给出生点
                        if (r < 2 || r > 23 || c < 2 || c > 23) continue;
                        
                        // 随机生成砖墙
                        if (Math.random() < 0.15) {
                            this.grid[r][c] = MAP.BRICK;
                        } 
                        // 随机生成铁墙
                        else if (Math.random() < 0.03) {
                            this.grid[r][c] = MAP.IRON;
                        }
                        // 随机生成草地
                        else if (Math.random() < 0.05) {
                            this.grid[r][c] = MAP.GRASS;
                        }
                    }
                }

                // 保护基地 (砖墙围一圈)
                this.grid[23][11] = MAP.BRICK;
                this.grid[23][12] = MAP.BRICK;
                this.grid[23][13] = MAP.BRICK;
                this.grid[24][11] = MAP.BRICK;
                this.grid[24][13] = MAP.BRICK;
                this.grid[25][11] = MAP.BRICK;
                this.grid[25][13] = MAP.BRICK;
                
                // 清空基地位置
                this.grid[24][12] = MAP.EMPTY;
                this.grid[25][12] = MAP.EMPTY;
            }

            draw(ctx) {
                for (let r = 0; r < MAP_SIZE; r++) {
                    for (let c = 0; c < MAP_SIZE; c++) {
                        const type = this.grid[r][c];
                        const x = c * TILE_SIZE;
                        const y = r * TILE_SIZE;

                        if (type === MAP.BRICK) {
                            ctx.fillStyle = '#a52a2a'; // Brown/Orange
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            // 砖块纹理
                            ctx.fillStyle = '#000';
                            ctx.fillRect(x, y + 5, TILE_SIZE, 2);
                            ctx.fillRect(x + 10, y, 2, 5);
                            ctx.fillRect(x + 5, y + 7, 2, 13);
                        } else if (type === MAP.IRON) {
                            ctx.fillStyle = '#aaa'; // Gray
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            // 铁块纹理
                            ctx.fillStyle = '#fff';
                            ctx.fillRect(x + 4, y + 4, 12, 12);
                            ctx.fillStyle = '#aaa';
                            ctx.fillRect(x + 8, y + 8, 4, 4);
                        }
                    }
                }
                
                // 绘制基地
                if (this.base.active) {
                    ctx.fillStyle = '#eebb00'; // Eagle Gold
                    ctx.beginPath();
                    // 简单的老鹰/旗帜形状
                    const bx = this.base.x + TILE_SIZE;
                    const by = this.base.y + TILE_SIZE;
                    ctx.moveTo(bx, by - 15);
                    ctx.lineTo(bx - 15, by + 10);
                    ctx.lineTo(bx + 15, by + 10);
                    ctx.fill();
                }
            }

            drawGrass(ctx) {
                // 草地需要覆盖在坦克上方，所以单独绘制
                for (let r = 0; r < MAP_SIZE; r++) {
                    for (let c = 0; c < MAP_SIZE; c++) {
                        if (this.grid[r][c] === MAP.GRASS) {
                            ctx.fillStyle = 'rgba(0, 200, 0, 0.5)';
                            ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            checkCollision(rect) {
                // 检查与地图块的碰撞
                const startC = Math.floor(rect.x / TILE_SIZE);
                const endC = Math.floor((rect.x + rect.w - 1) / TILE_SIZE);
                const startR = Math.floor(rect.y / TILE_SIZE);
                const endR = Math.floor((rect.y + rect.h - 1) / TILE_SIZE);

                for (let r = startR; r <= endR; r++) {
                    for (let c = startC; c <= endC; c++) {
                        if (r >= 0 && r < MAP_SIZE && c >= 0 && c < MAP_SIZE) {
                            const tile = this.grid[r][c];
                            if (tile === MAP.BRICK || tile === MAP.IRON || tile === MAP.WATER) {
                                return true;
                            }
                        }
                    }
                }
                
                // 检查与基地的碰撞
                if (this.base.active && rectIntersect(rect, this.base)) {
                    return true;
                }
                
                return false;
            }
            
            destroyTile(r, c) {
                if (r >= 0 && r < MAP_SIZE && c >= 0 && c < MAP_SIZE) {
                    if (this.grid[r][c] === MAP.BRICK) {
                        this.grid[r][c] = MAP.EMPTY;
                        return true;
                    }
                }
                return false;
            }
        }

        // 游戏主控
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.input = new InputHandler();
                this.ui = new UI();
                this.reset();
            }

            reset() {
                this.map = new GameMap();
                this.map.generate();
                this.player = new Player();
                this.enemies = [];
                this.bullets = [];
                this.items = [];
                this.enemySpawnTimer = 0;
                this.enemiesToSpawn = 20;
                this.state = 'MENU'; // MENU, PLAYING, GAMEOVER, VICTORY
                
                this.ui.showScreen('start-screen');
                this.ui.updateHud();
            }

            start() {
                this.state = 'PLAYING';
                this.ui.hideAllScreens();
                this.lastTime = 0;
                requestAnimationFrame((ts) => this.loop(ts));
            }

            loop(timestamp) {
                if (this.state !== 'PLAYING') return;

                const deltaTime = timestamp - this.lastTime;
                if (deltaTime >= 1000 / FPS) {
                    this.update();
                    this.draw();
                    this.lastTime = timestamp;
                }
                
                requestAnimationFrame((ts) => this.loop(ts));
            }

            update() {
                // 1. 更新玩家
                if (this.player.lives > 0) {
                    this.player.update(this.input);
                } else {
                    this.gameOver("玩家牺牲！");
                }

                // 2. 生成敌人
                if (this.enemiesToSpawn > 0 && this.enemies.length < 4) {
                    if (this.enemySpawnTimer <= 0) {
                        const spawnX = (randomInt(0, 2) * 12) * TILE_SIZE; // 0, 12, 24 -> 左中右
                        const spawnY = 0;
                        // 确保出生点无碰撞
                        const canSpawn = !this.enemies.some(e => Math.abs(e.x - spawnX) < TILE_SIZE*2 && Math.abs(e.y - spawnY) < TILE_SIZE*2);
                        
                        if (canSpawn) {
                            const hasItem = (this.enemiesToSpawn % 4 === 0); // 每4个带道具
                            this.enemies.push(new Enemy(spawnX, spawnY, hasItem));
                            this.enemiesToSpawn--;
                            this.enemySpawnTimer = 180; // 3秒
                            this.ui.updateHud();
                        }
                    } else {
                        this.enemySpawnTimer--;
                    }
                } else if (this.enemiesToSpawn === 0 && this.enemies.length === 0) {
                    this.victory();
                }

                // 3. 更新敌人
                this.enemies.forEach(enemy => enemy.update());

                // 4. 更新子弹
                this.bullets.forEach(bullet => bullet.update());
                
                // 5. 更新道具
                this.items.forEach(item => item.update());
                
                // 6. 碰撞检测
                this.checkCollisions();

                // 7. 清理实体
                this.bullets = this.bullets.filter(b => !b.markedForDeletion);
                this.enemies = this.enemies.filter(e => !e.markedForDeletion);
                this.items = this.items.filter(i => !i.markedForDeletion);
            }

            checkCollisions() {
                // 子弹碰撞逻辑
                this.bullets.forEach(bullet => {
                    const rect = bullet.getRect();
                    
                    // A. 子弹 vs 地图
                    // 获取子弹所在的格子
                    const centerR = Math.floor((bullet.y + bullet.h/2) / TILE_SIZE);
                    const centerC = Math.floor((bullet.x + bullet.w/2) / TILE_SIZE);
                    
                    if (centerR >= 0 && centerR < MAP_SIZE && centerC >= 0 && centerC < MAP_SIZE) {
                        const tile = this.map.grid[centerR][centerC];
                        if (tile === MAP.BRICK) {
                            this.map.destroyTile(centerR, centerC);
                            bullet.markedForDeletion = true;
                            return;
                        } else if (tile === MAP.IRON) {
                            bullet.markedForDeletion = true;
                            return;
                        }
                    }
                    
                    // B. 子弹 vs 基地
                    if (this.map.base.active && rectIntersect(rect, this.map.base)) {
                        this.map.base.active = false;
                        bullet.markedForDeletion = true;
                        this.gameOver("基地被摧毁！");
                        return;
                    }

                    // C. 子弹 vs 坦克
                    if (bullet.owner instanceof Player) {
                        // 玩家打敌人
                        this.enemies.forEach(enemy => {
                            if (rectIntersect(rect, enemy.getRect())) {
                                enemy.markedForDeletion = true;
                                bullet.markedForDeletion = true;
                                this.player.score += 100;
                                this.ui.updateHud();
                                
                                // 掉落道具
                                if (enemy.hasItem) {
                                    const type = Math.random() < 0.5 ? ITEM.ATTACK_UP : ITEM.LIFE_UP;
                                    this.items.push(new Item(enemy.x, enemy.y, type));
                                }
                            }
                        });
                    } else {
                        // 敌人打玩家
                        if (rectIntersect(rect, this.player.getRect())) {
                            this.player.lives--;
                            bullet.markedForDeletion = true;
                            this.player.x = 9 * TILE_SIZE; // 重生位置
                            this.player.y = 24 * TILE_SIZE;
                            this.player.dir = DIR.UP;
                            this.ui.updateHud();
                        }
                    }
                    
                    // D. 子弹 vs 子弹 (抵消)
                    // 简化版暂不实现
                });
                
                // 玩家拾取道具
                this.items.forEach(item => {
                    if (rectIntersect(this.player.getRect(), item.getRect())) {
                        this.player.applyPowerUp(item.type);
                        item.markedForDeletion = true;
                    }
                });
            }

            draw() {
                // 清屏
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 绘制地图 (底层)
                this.map.draw(this.ctx);

                // 绘制道具
                this.items.forEach(item => item.draw(this.ctx));

                // 绘制坦克
                if (this.player.lives > 0) this.player.draw(this.ctx);
                this.enemies.forEach(enemy => enemy.draw(this.ctx));

                // 绘制子弹
                this.bullets.forEach(bullet => bullet.draw(this.ctx));
                
                // 绘制草地 (遮挡层)
                this.map.drawGrass(this.ctx);
            }

            gameOver(reason) {
                this.state = 'GAMEOVER';
                document.getElementById('fail-reason').innerText = reason;
                document.getElementById('final-score-lose').innerText = this.player.score;
                this.ui.showScreen('game-over-screen');
            }

            victory() {
                this.state = 'VICTORY';
                document.getElementById('final-score-win').innerText = this.player.score;
                this.ui.showScreen('victory-screen');
            }
        }

        // 输入处理
        class InputHandler {
            constructor() {
                this.keys = {};
                window.addEventListener('keydown', e => {
                    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) > -1) {
                        e.preventDefault();
                    }
                    this.keys[e.key] = true;
                });
                window.addEventListener('keyup', e => {
                    this.keys[e.key] = false;
                });
            }
        }

        // UI 管理
        class UI {
            constructor() {
                this.screens = document.querySelectorAll('.ui-screen');
                this.livesDisplay = document.getElementById('lives-display');
                this.enemiesDisplay = document.getElementById('enemies-display');
                this.scoreDisplay = document.getElementById('score-display');
            }

            hideAllScreens() {
                this.screens.forEach(s => s.classList.add('hidden'));
            }

            showScreen(id) {
                this.hideAllScreens();
                document.getElementById(id).classList.remove('hidden');
            }

            updateHud() {
                if (game && game.player) {
                    this.livesDisplay.innerText = game.player.lives;
                    this.enemiesDisplay.innerText = game.enemiesToSpawn + game.enemies.length;
                    this.scoreDisplay.innerText = game.player.score;
                }
            }
        }

        // --- 启动游戏 ---
        window.game = new Game();

    </script>
</body>
</html>
