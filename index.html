<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1f2a;
      --cell: #2b3140;
      --text: #edf0f7;
      --muted: #9aa3b5;
      --accent: #66f2b1;
      --radius: 14px;
      --gap: 10px;
      --tile-font: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(102, 242, 177, 0.15), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(99, 134, 255, 0.17), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      padding: 20px;
    }

    .game {
      width: min(92vw, 470px);
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.7rem);
      line-height: 1;
      letter-spacing: 1px;
      font-family: var(--tile-font);
    }

    .score-wrap {
      text-align: right;
    }

    .score-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score {
      margin: 2px 0 0;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--tile-font);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      background: #2b3244;
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #364059;
    }

    .hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .grid {
      background: #252c3a;
      border-radius: var(--radius);
      padding: var(--gap);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      touch-action: none;
      user-select: none;
    }

    .tile {
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--cell);
      font-family: var(--tile-font);
      font-size: clamp(1.1rem, 4vw, 2rem);
      font-weight: 700;
      color: #eaf0ff;
      transition: background 140ms ease, color 140ms ease, transform 100ms ease;
    }

    .tile[data-v="0"] { color: transparent; }
    .tile[data-v="2"] { background: #4b5b7d; }
    .tile[data-v="4"] { background: #4b6887; }
    .tile[data-v="8"] { background: #47789e; }
    .tile[data-v="16"] { background: #3f8b9c; }
    .tile[data-v="32"] { background: #3a9a86; }
    .tile[data-v="64"] { background: #2daf76; }
    .tile[data-v="128"] { background: #4dbf5c; font-size: clamp(1rem, 3.7vw, 1.7rem); }
    .tile[data-v="256"] { background: #7ec53f; font-size: clamp(1rem, 3.7vw, 1.7rem); }
    .tile[data-v="512"] { background: #b8c731; font-size: clamp(1rem, 3.7vw, 1.7rem); color: #10131a; }
    .tile[data-v="1024"] { background: #e5bd26; font-size: clamp(0.9rem, 3.2vw, 1.35rem); color: #12151e; }
    .tile[data-v="2048"] { background: #f39a1f; font-size: clamp(0.9rem, 3.2vw, 1.3rem); color: #131722; }
    .tile[data-v="4096"],
    .tile[data-v="8192"] { background: #f1653b; font-size: clamp(0.8rem, 2.9vw, 1.1rem); color: #fff; }

    .overlay {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: rgba(10, 13, 20, 0.82);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-card h2 {
      margin: 0 0 10px;
      font-size: 1.9rem;
      font-family: var(--tile-font);
    }

    .overlay-card p {
      margin: 0 0 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="game">
    <section class="header">
      <h1 class="title">2048</h1>
      <div class="score-wrap">
        <p class="score-label">Score</p>
        <p id="score" class="score">0</p>
      </div>
    </section>
    <section class="actions">
      <button id="new-game">New Game</button>
      <button id="continue">Continue</button>
    </section>
    <p class="hint">Use arrow keys or swipe to move tiles.</p>
    <section id="grid" class="grid" aria-label="2048 board"></section>
    <section id="overlay" class="overlay">
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <button id="overlay-button">Play Again</button>
      </div>
    </section>
  </main>

  <script>
    const SIZE = 4;
    let board = [];
    let score = 0;
    let hasWon = false;
    let blocked = false;

    const gridEl = document.getElementById("grid");
    const scoreEl = document.getElementById("score");
    const newGameBtn = document.getElementById("new-game");
    const continueBtn = document.getElementById("continue");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayText = document.getElementById("overlay-text");
    const overlayBtn = document.getElementById("overlay-button");

    function buildGrid() {
      gridEl.innerHTML = "";
      for (let i = 0; i < SIZE * SIZE; i += 1) {
        const cell = document.createElement("div");
        cell.className = "tile";
        cell.dataset.v = "0";
        gridEl.appendChild(cell);
      }
    }

    function randomEmptyCell() {
      const empty = [];
      for (let r = 0; r < SIZE; r += 1) {
        for (let c = 0; c < SIZE; c += 1) {
          if (board[r][c] === 0) empty.push([r, c]);
        }
      }
      if (!empty.length) return null;
      return empty[Math.floor(Math.random() * empty.length)];
    }

    function spawnTile() {
      const cell = randomEmptyCell();
      if (!cell) return;
      const [r, c] = cell;
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function resetGame() {
      board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      score = 0;
      hasWon = false;
      blocked = false;
      hideOverlay();
      spawnTile();
      spawnTile();
      render();
    }

    function updateScore(next) {
      score += next;
      scoreEl.textContent = String(score);
    }

    function mergeLine(line) {
      const original = [...line];
      const filtered = line.filter((n) => n !== 0);
      const merged = [];
      let i = 0;
      while (i < filtered.length) {
        if (filtered[i] === filtered[i + 1]) {
          const v = filtered[i] * 2;
          merged.push(v);
          updateScore(v);
          if (v === 2048 && !hasWon) {
            hasWon = true;
            showOverlay("You reached 2048!", "Keep going for a bigger score.", "Continue");
          }
          i += 2;
        } else {
          merged.push(filtered[i]);
          i += 1;
        }
      }
      while (merged.length < SIZE) merged.push(0);
      const moved = merged.some((v, idx) => v !== original[idx]);
      return { line: merged, moved };
    }

    function move(direction) {
      if (blocked) return;
      let movedAny = false;
      for (let i = 0; i < SIZE; i += 1) {
        let line = [];
        for (let j = 0; j < SIZE; j += 1) {
          if (direction === "left") line.push(board[i][j]);
          if (direction === "right") line.push(board[i][SIZE - 1 - j]);
          if (direction === "up") line.push(board[j][i]);
          if (direction === "down") line.push(board[SIZE - 1 - j][i]);
        }
        const { line: merged, moved } = mergeLine(line);
        movedAny = movedAny || moved;
        for (let j = 0; j < SIZE; j += 1) {
          if (direction === "left") board[i][j] = merged[j];
          if (direction === "right") board[i][SIZE - 1 - j] = merged[j];
          if (direction === "up") board[j][i] = merged[j];
          if (direction === "down") board[SIZE - 1 - j][i] = merged[j];
        }
      }
      if (!movedAny) return;
      spawnTile();
      render();
      if (isGameOver()) {
        blocked = true;
        showOverlay("Game over", `Final score: ${score}`, "Play Again");
      }
    }

    function isGameOver() {
      for (let r = 0; r < SIZE; r += 1) {
        for (let c = 0; c < SIZE; c += 1) {
          if (board[r][c] === 0) return false;
          if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return false;
          if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return false;
        }
      }
      return true;
    }

    function render() {
      const cells = gridEl.children;
      let idx = 0;
      for (let r = 0; r < SIZE; r += 1) {
        for (let c = 0; c < SIZE; c += 1) {
          const value = board[r][c];
          const el = cells[idx];
          el.dataset.v = String(value);
          el.textContent = value === 0 ? "" : String(value);
          idx += 1;
        }
      }
      scoreEl.textContent = String(score);
    }

    function showOverlay(title, text, buttonText) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlayBtn.textContent = buttonText;
      overlay.classList.add("show");
    }

    function hideOverlay() {
      overlay.classList.remove("show");
    }

    window.addEventListener("keydown", (event) => {
      const map = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down",
        a: "left",
        d: "right",
        w: "up",
        s: "down"
      };
      const direction = map[event.key];
      if (!direction) return;
      event.preventDefault();
      move(direction);
    });

    let touchStartX = 0;
    let touchStartY = 0;

    gridEl.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    gridEl.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      const threshold = 24;
      if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? "right" : "left");
      } else {
        move(dy > 0 ? "down" : "up");
      }
    }, { passive: true });

    newGameBtn.addEventListener("click", resetGame);
    continueBtn.addEventListener("click", hideOverlay);
    overlayBtn.addEventListener("click", resetGame);

    buildGrid();
    resetGame();
  </script>
</body>
</html>
