<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据看板 | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-color: rgba(75, 85, 99, 0.4);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-emerald: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0f172a 50%, var(--bg-secondary) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1440px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            margin-bottom: 2rem;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .metric-card:nth-child(1) { animation-delay: 0.1s; }
        .metric-card:nth-child(2) { animation-delay: 0.2s; }
        .metric-card:nth-child(3) { animation-delay: 0.3s; }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 40px rgba(6, 182, 212, 0.1);
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .metric-card:hover::before {
            opacity: 1;
        }

        .metric-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .metric-icon.cyan { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }
        .metric-icon.purple { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }
        .metric-icon.emerald { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); }

        .metric-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .metric-trend {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            margin-top: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 500;
        }

        .metric-trend.positive {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-emerald);
        }

        .metric-trend.negative {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto auto;
            gap: 1.5rem;
        }

        .chart-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            animation: fadeInUp 0.6s ease-out backwards;
            transition: all 0.3s ease;
        }

        .chart-card:hover {
            border-color: rgba(75, 85, 99, 0.6);
        }

        .chart-card:nth-child(1) { animation-delay: 0.4s; }
        .chart-card:nth-child(2) { animation-delay: 0.5s; }
        .chart-card:nth-child(3) { animation-delay: 0.6s; }

        .chart-card.full-width {
            grid-column: 1 / -1;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .chart-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chart-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        .chart-container.heatmap {
            height: 320px;
        }

        .heatmap-container {
            display: grid;
            grid-template-columns: 50px repeat(24, 1fr);
            grid-template-rows: 24px repeat(7, 1fr);
            gap: 3px;
            height: 100%;
            overflow: hidden;
        }

        .heatmap-corner {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heatmap-hour-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-align: center;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 4px;
        }

        .heatmap-day-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }

        .heatmap-cell {
            border-radius: 3px;
            transition: all 0.2s ease;
            cursor: pointer;
            min-height: 24px;
        }

        .heatmap-cell:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1024px) {
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            .metric-value {
                font-size: 1.5rem;
            }
            .chart-container {
                height: 220px;
            }
            .heatmap-container {
                grid-template-columns: 40px repeat(24, 1fr);
            }
        }

        .tooltip {
            position: fixed;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: var(--text-primary);
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .tooltip.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>数据看板</h1>
            <p>实时监控核心业务指标，助力数据驱动决策</p>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-icon cyan">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <div class="metric-label">总用户数</div>
                <div class="metric-value">128,456</div>
                <div class="metric-trend positive">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                    +12.5%
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon purple">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <div class="metric-label">转化率</div>
                <div class="metric-value">3.24%</div>
                <div class="metric-trend negative">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline>
                        <polyline points="17 18 23 18 23 12"></polyline>
                    </svg>
                    -2.1%
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon emerald">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </div>
                <div class="metric-label">日均收入</div>
                <div class="metric-value">¥89,560</div>
                <div class="metric-trend positive">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                    +8.3%
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">销售趋势</div>
                        <div class="chart-subtitle">近30天销售额变化</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">地区分布</div>
                        <div class="chart-subtitle">各省份销售占比</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="regionChart"></canvas>
                </div>
            </div>

            <div class="chart-card full-width">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">用户活跃度热力图</div>
                        <div class="chart-subtitle">一周内各时段活跃用户分布</div>
                    </div>
                </div>
                <div class="chart-container heatmap">
                    <div id="heatmapContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        const chartColors = {
            cyan: '#06b6d4',
            blue: '#3b82f6',
            purple: '#8b5cf6',
            pink: '#ec4899',
            emerald: '#10b981',
            orange: '#f97316',
            gray: '#6b7280'
        };

        function generateSalesData() {
            const data = [];
            const labels = [];
            const baseValue = 50000;
            for (let i = 29; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                labels.push(`${date.getMonth() + 1}/${date.getDate()}`);
                const trend = Math.sin(i * 0.3) * 8000;
                const noise = (Math.random() - 0.5) * 10000;
                data.push(Math.max(30000, baseValue + trend + noise));
            }
            return { labels, data };
        }

        function initSalesChart() {
            const ctx = document.getElementById('salesChart').getContext('2d');
            const { labels, data } = generateSalesData();

            const gradient = ctx.createLinearGradient(0, 0, 0, 280);
            gradient.addColorStop(0, 'rgba(6, 182, 212, 0.3)');
            gradient.addColorStop(1, 'rgba(6, 182, 212, 0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '销售额',
                        data: data,
                        borderColor: chartColors.cyan,
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointHoverBackgroundColor: chartColors.cyan,
                        pointHoverBorderColor: '#fff',
                        pointHoverBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.95)',
                            titleColor: '#f9fafb',
                            bodyColor: '#9ca3af',
                            borderColor: 'rgba(75, 85, 99, 0.4)',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return `¥${context.raw.toLocaleString()}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(75, 85, 99, 0.2)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#9ca3af',
                                font: { size: 11 },
                                maxTicksLimit: 10
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(75, 85, 99, 0.2)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#9ca3af',
                                font: { size: 11 },
                                callback: function(value) {
                                    return '¥' + (value / 1000) + 'k';
                                }
                            }
                        }
                    }
                }
            });
        }

        function initRegionChart() {
            const ctx = document.getElementById('regionChart').getContext('2d');

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['广东省', '浙江省', '江苏省', '北京市', '上海市', '其他'],
                    datasets: [{
                        data: [28, 18, 15, 12, 10, 17],
                        backgroundColor: [
                            chartColors.cyan,
                            chartColors.blue,
                            chartColors.purple,
                            chartColors.pink,
                            chartColors.emerald,
                            chartColors.gray
                        ],
                        borderWidth: 0,
                        hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#9ca3af',
                                font: { size: 12 },
                                padding: 15,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.95)',
                            titleColor: '#f9fafb',
                            bodyColor: '#9ca3af',
                            borderColor: 'rgba(75, 85, 99, 0.4)',
                            borderWidth: 1,
                            padding: 12,
                            callbacks: {
                                label: function(context) {
                                    return `${context.label}: ${context.raw}%`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function generateHeatmapData() {
            const data = [];
            for (let day = 0; day < 7; day++) {
                const row = [];
                for (let hour = 0; hour < 24; hour++) {
                    let baseValue = 30;
                    if (hour >= 9 && hour <= 18) {
                        baseValue = 70 + Math.random() * 30;
                    } else if (hour >= 19 && hour <= 22) {
                        baseValue = 80 + Math.random() * 20;
                    } else if (hour >= 0 && hour <= 6) {
                        baseValue = 10 + Math.random() * 15;
                    }
                    if (day >= 5) {
                        baseValue *= 1.2;
                    }
                    row.push(Math.floor(baseValue));
                }
                data.push(row);
            }
            return data;
        }

        function initHeatmap() {
            const container = document.getElementById('heatmapContainer');
            const data = generateHeatmapData();
            const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

            container.innerHTML = '';

            const corner = document.createElement('div');
            corner.className = 'heatmap-corner';
            container.appendChild(corner);

            for (let hour = 0; hour < 24; hour++) {
                const label = document.createElement('div');
                label.className = 'heatmap-hour-label';
                label.textContent = hour % 3 === 0 ? `${hour}` : '';
                container.appendChild(label);
            }

            for (let day = 0; day < 7; day++) {
                const dayLabel = document.createElement('div');
                dayLabel.className = 'heatmap-day-label';
                dayLabel.textContent = days[day];
                container.appendChild(dayLabel);

                for (let hour = 0; hour < 24; hour++) {
                    const cell = document.createElement('div');
                    cell.className = 'heatmap-cell';
                    const value = data[day][hour];
                    const intensity = value / 100;
                    
                    const r = Math.floor(6 + (59 - 6) * intensity);
                    const g = Math.floor(182 + (130 - 182) * intensity);
                    const b = Math.floor(212 + (246 - 212) * intensity);
                    
                    cell.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${0.4 + intensity * 0.6})`;
                    cell.dataset.day = days[day];
                    cell.dataset.hour = hour;
                    cell.dataset.value = value;

                    cell.addEventListener('mouseenter', showTooltip);
                    cell.addEventListener('mouseleave', hideTooltip);

                    container.appendChild(cell);
                }
            }
        }

        const tooltip = document.getElementById('tooltip');

        function showTooltip(e) {
            const cell = e.target;
            tooltip.innerHTML = `
                <div style="font-weight: 600; margin-bottom: 4px;">${cell.dataset.day} ${cell.dataset.hour}:00</div>
                <div>活跃度: ${cell.dataset.value}%</div>
            `;
            tooltip.classList.add('visible');
            
            const rect = cell.getBoundingClientRect();
            tooltip.style.left = `${rect.left + rect.width / 2 - 60}px`;
            tooltip.style.top = `${rect.top - 60}px`;
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        document.addEventListener('DOMContentLoaded', function() {
            initSalesChart();
            initRegionChart();
            initHeatmap();
        });
    </script>
</body>
</html>
