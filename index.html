<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QR Snap - 极简在线二维码生成工具，粘贴即生成，无需注册登录">
    <title>QR Snap - 极简二维码生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="header__title">
                <span class="header__logo">QR</span>
                <span class="header__name">Snap</span>
            </h1>
            <p class="header__tagline">粘贴即生成 · 无需登录</p>
        </header>

        <main class="main">
            <div class="input-section">
                <label for="text-input" class="input-label">输入内容</label>
                <textarea 
                    id="text-input" 
                    class="input-field" 
                    placeholder="粘贴你的网址或文本链接..."
                    aria-label="输入要生成二维码的文本或链接"
                    maxlength="2048"
                    autofocus
                ></textarea>
                <div class="input-counter">
                    <span id="char-count">0</span> / 2048
                </div>
            </div>

            <div class="qr-section">
                <div class="qr-container" id="qr-container">
                    <div class="qr-placeholder">
                        <svg class="qr-placeholder__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="3" height="3"/>
                            <rect x="18" y="14" width="3" height="3"/>
                            <rect x="14" y="18" width="3" height="3"/>
                            <rect x="18" y="18" width="3" height="3"/>
                        </svg>
                        <p class="qr-placeholder__text">输入内容后生成二维码</p>
                    </div>
                    <canvas id="qr-canvas" class="qr-canvas" style="display: none;"></canvas>
                </div>
                <p class="qr-hint" id="qr-hint" style="display: none;">
                    <svg class="qr-hint__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                        <path d="M12 16v-4M12 8h.01"/>
                    </svg>
                    右键点击图片可保存
                </p>
            </div>
        </main>

        <footer class="footer">
            <p class="footer__text">纯前端处理 · 数据不上传 · 隐私安全</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
